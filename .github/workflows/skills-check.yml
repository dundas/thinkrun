name: Skills check

# Keeps the four harness skill directories identical and every trigger-eval
# fixture well-formed. Deterministic — no model calls; the routing benchmark
# in evals/BENCHMARK.md is run manually and recorded in the PR.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  skills-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (v4.4.0)
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2 (v2.2.0)
        with:
          bun-version: latest
      - name: Mirrors + fixtures + frontmatter
        run: bun run check
      - name: Unit tests
        run: bun run test
